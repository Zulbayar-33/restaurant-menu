<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайхан Хоол - Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍽️ Сайхан Хоол</h1>
        <p>Амттай, чанартай зоогийг танд санал болгож байна</p>
    </header>

    <main class="menu-container">
        <div class="menu-item">
            <img src="https://images.unsplash.com/photo-1544025162-d76694265947" alt="Grill Steak">
            <div class="item-content">
                <div class="item-header">
                    <span class="item-title">Хуучин Стейк</span>
                    <span class="item-price">28,000₮</span>
                </div>
                <p class="item-desc">Шүүслэг шарж болгосон үхрийн мах амтлагч соусаар баяжуулсан.</p>
                <button class="order-btn" onclick="orderItem('Хуучин Стейк')">Захиалах</button>
            </div>
        </div>

        <div class="menu-item">
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38" alt="Pizza">
            <div class="item-content">
                <div class="item-header">
                    <span class="item-title">Пепперони Пицца</span>
                    <span class="item-price">24,000₮</span>
                </div>
                <p class="item-desc">Халуун ногоотой пепперони хиам болон хайлсан бяслагтай.</p>
                <button class="order-btn" onclick="orderItem('Пепперони Пицца')">Захиалах</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
