<!DOCTYPE html>
<html lang="mn" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сайхан Хоол - Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar sticky-top site-nav">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">🍽️ Сайхан Хоол</a>
    <button class="btn btn-cart" data-bs-toggle="offcanvas" data-bs-target="#cartPanel">
      🛒 Сагс <span id="cartCount" class="badge rounded-pill">0</span>
    </button>
  </div>
</nav>

<header class="hero">
  <span class="blob blob-1"></span><span class="blob blob-2"></span>
  <div class="container text-center hero-inner">
    <span class="badge hero-badge">Online захиалга</span>
    <h1>Монгол хоолны меню</h1>
    <p>Амттай, чанартай зоогийг танд санал болгож байна.</p>
  </div>
</header>

<main class="container pb-5">
  <div class="toolbar">
    <div class="category-tabs" role="group">
      <button class="btn active" data-category="all">Бүгд</button>
      <button class="btn" data-category="main">Үндсэн цэс</button>
      <button class="btn" data-category="salad">Салат</button>
      <button class="btn" data-category="drink">Уух зүйл</button>
    </div>
    <input id="searchInput" class="form-control search" placeholder="Хоол хайх...">
  </div>

  <p id="resultCount" class="result-count"></p>
  <div id="menuGrid" class="menu-grid"></div>
</main>

<div class="offcanvas offcanvas-end" tabindex="-1" id="cartPanel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">🛒 Миний сагс</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">
    <div id="cartItems"></div>

    <hr>

    <div class="d-flex justify-content-between fs-5 fw-bold">
      <span>Нийт:</span>
      <span id="totalPrice">0₮</span>
    </div>

    <h6 class="mt-4 mb-2">Захиалгын мэдээлэл</h6>
    <input id="tableNo" class="form-control mb-2" placeholder="Ширээ / Хаяг">
    <textarea id="note" class="form-control" rows="2" placeholder="Тайлбар"></textarea>

    <button id="submitBtn" class="btn btn-order w-100 mt-3 py-3">Захиалга илгээх</button>

    <p id="message" class="mt-3 text-center fw-semibold"></p>

    <h6 class="mt-4 mb-2">Миний захиалгууд</h6>
    <div id="myOrders"><p class="text-muted small">Захиалга алга байна.</p></div>
  </div>
</div>

<div id="toast" class="toast-msg" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
